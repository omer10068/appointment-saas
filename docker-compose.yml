services:
  postgres:
    image: postgres:16
    container_name: appointment_saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: appointment_password
      POSTGRES_DB: appointment_saas
    ports:
      - "5432:5432"
    volumes:
      - appointment_postgres_data:/var/lib/postgresql/data

volumes:
  appointment_postgres_data:
