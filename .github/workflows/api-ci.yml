name: API CI

on: [push, pull_request]

jobs:
  ci:
    name: Test, Lint, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointment_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appointment_saas_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appointment_saas_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.9'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api run prisma:generate

      - name: Unit tests
        run: pnpm test

      - name: Apply test database migrations
        run: pnpm --filter api db:test:migrate

      - name: E2E tests
        run: pnpm --filter api test:e2e

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
